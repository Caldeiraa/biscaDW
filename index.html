<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bisca Capixaba</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header>
        <h1>BISCA CAPIXABA</h1>
    </header>
    <main>
        <section id="scoreboard" class="scoreboard">
            <div class="team" id="teamA">
                <h2>Dupla 1 (Você + Parceiro)</h2>
                <p>Pontuação: <span id="scoreA">0</span></p>
            </div>
            <div class="team" id="teamB">
                <h2>Dupla 2 (Adversário + Adversário)</h2>
                <p>Pontuação: <span id="scoreB">0</span></p>
            </div>
        </section>
        <section id="table" class="table">
            <div class="player" id="player4">
                <div class="player-name">Adversário</div>
                <div class="player-cards" data-player="4"></div>
            </div>
            <div class="center-area" id="centerArea">
                <div id="trumpSuit" class="trump-suit">Trunfo: —</div>
                <div class="deck-pile" id="deckPile">🂠</div>
                <div class="played-cards" id="playedCards"></div>
            </div>
            <div class="player" id="player2">
                <div class="player-name">Adversário</div>
                <div class="player-cards" data-player="2"></div>
            </div>
            <div class="player" id="player3">
                <div class="player-name">Parceiro</div>
                <div class="player-cards" data-player="3"></div>
            </div>
            <div class="player" id="player1">
                <div class="player-name">Você</div>
                <div class="player-cards" data-player="1"></div>
            </div>
        </section>
        <section id="hand-controls" class="hand-controls">
            <button id="cutButton" class="action-button">CORTAR</button>
            <button id="baterButton" class="action-button">BATER</button>
            <button id="restartButton" class="action-button">REINICIAR</button>
            <div id="playerHand" class="player-hand"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
